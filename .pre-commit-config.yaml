repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: bash -c 'PATH="$PWD/.venv/bin:$PATH" exec pytest -q'
        language: system
        pass_filenames: false
        always_run: true

      - id: vulture
        name: vulture
        entry: bash -c 'PATH="$PWD/.venv/bin:$PATH" exec vulture hydra_plugins tests vulture_whitelist.py'
        language: system
        pass_filenames: false
        always_run: true

      - id: duplicate-code
        name: duplicate-code
        entry: bash -c 'PATH="$PWD/.venv/bin:$PATH" exec pylint --disable=all --enable=duplicate-code hydra_plugins tests'
        language: system
        pass_filenames: false
        always_run: true
